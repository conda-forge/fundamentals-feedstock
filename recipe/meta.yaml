{% set name = "fundamentals" %}
{% set version = "3.0.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
   url: https://pypi.org/packages/source/f/fundamentals/fundamentals-{{ version }}.tar.gz
   sha256: d0f4ca54987ab519233b1b0014e2099ae469de5a695ebb31e9126e99f0d75d90

build:
  number: 0
  noarch: python
  entry_points:
    - mysqlSucker=fundamentals.mysql.directory_script_runner:main
    - yaml2db=fundamentals.mysql.yaml_to_database:main
    - sqlite2mysql=fundamentals.mysql.sqlite2mysql:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.12
    - wheel
    - setuptools >=70
    - setuptools-scm
  run:
    - docopt
    - future
    - psutil
    - python >=3.12
    - python-dateutil
    - pyyaml
    - requests
    - python-daemon
    - tqdm
    - unicodecsv
    - pymysql
    - multiprocess
    - six
    - numpy
    - pandas

test:
  imports:
    - fundamentals
  commands:
    - python -c "import importlib.metadata as m, sys; sys.exit(0 if m.version('fundamentals') == '{{ version }}' else 1)"
    - mysqlSucker --help

about:
  home: https://github.com/thespacedoctor/fundamentals
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: Some fundamental tools required by most self-respecting python-packages bundled in one place. Very opinionated project setup tools including logging, plain-text settings files and database connections.
  doc_url: https://fundamentals.readthedocs.io
  dev_url: https://github.com/thespacedoctor/fundamentals

extra:
  recipe-maintainers:
    - thespacedoctor
